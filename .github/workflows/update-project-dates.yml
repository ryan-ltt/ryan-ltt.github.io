name: Update project dates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-project-dates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so `git log` can see the last commit per project dir
          fetch-depth: 0

      - name: Refresh dates on the projects page
        run: python3 update_project_dates.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- projects/index.html; then
            echo "No date changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/index.html
          # [skip ci] stops this commit from retriggering the workflow
          git commit -m "update project dates [skip ci]"
          git push
